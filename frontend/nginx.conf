server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are bounded by the backend too; keep nginx from rejecting first.
    client_max_body_size 200m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;

        # Collaboration rooms are WebSockets — these headers are what makes
        # the upgrade survive the proxy hop.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Analysis of a long track can take several seconds
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
