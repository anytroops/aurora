services:
  backend:
    build: ./backend
    environment:
      # AI features are optional — everything else works without a key.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AURORA_MODEL: ${AURORA_MODEL:-claude-opus-4-8}
      AURORA_MAX_AUDIO_MB: ${AURORA_MAX_AUDIO_MB:-100}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8001/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
